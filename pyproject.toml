
[tool.poetry]
name = "nutrition_coach"
version = "1.0.0"
description = ""
authors = ["Jevin Maltais <jevin@quickjack.ca>"]
readme = "README.md"
license = "MIT"
packages = [
  { include = "nutrition_coach", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
python-dotenv = "^1.1.0"
scrapegraphai = "^1.52.0"
playwright = "^1.52.0"
myfitnesspal = "^2.1.2"
flask = "^3.0.0"  # Or any other appropriate version
browser-cookie3 = "^0.19.1" # Or any other appropriate version

[tool.poetry.group.dev.dependencies]
commitizen = "^3.29.0"
pdbpp = "^0.10.3"
mypy = "^1.11.0"
pytest-coverage = "^0.0"
pytest-dependency = "^0.6.0"
pytest = "^8.3.1"


[tool.commitizen]
version = "1.0.0"
update_changelog_on_bump = true
version_provider = "scm"
tag_format = "v$major.$minor.$patch$prerelease"
version_files = [
    "pyproject.toml:version",
    "src/nutrition_coach/__init__.py"
]

[tool.ruff]
line-length = 88  # match Black default line length
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "UP", # pyupgrade
  "D",  # pydocstyle
  "I",  # isort
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
branch = true
relative_files = true
source = [
    "src/nutrition_coach",
]

[tool.coverage.report]
skip_empty = true
